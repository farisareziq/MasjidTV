server {
    listen 80;
    listen [::]:80;
    server_name masjidtv.example.com;

    # Redirect HTTP -> HTTPS (uncomment after certbot)
    # return 301 https://$host$request_uri;

    # --- Main reverse proxy ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support — long-lived connections, no buffering
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Static assets — let nginx serve directly (bypass Node) ---
    # Uncomment after copying dist/public to /var/masjidtv/public
    # location ~ ^/(css|js|icons|vendor|assets)/ {
    #     root /var/masjidtv/public;
    #     expires 1d;
    #     add_header Cache-Control "public, max-age=86400";
    # }

    # --- Uploaded media — let nginx serve directly ---
    # Uncomment after setting MASJIDTV_UPLOADS_DIR=/var/masjidtv/uploads
    # location /uploads/ {
    #     alias /var/masjidtv/uploads/;
    #     expires 1d;
    #     add_header Cache-Control "public, max-age=86400";
    # }

    # --- Upload body size ---
    client_max_body_size 50M;

    # --- Security headers ---
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "geolocation=(), microphone=()";
}
