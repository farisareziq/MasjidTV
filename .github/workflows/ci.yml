name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bina pakej asas dahulu — type/test server & cloud menyelesaikan
      # @masjidtv/{shared,db} melalui dist/ (lihat package exports).
      - name: Build workspace deps
        run: pnpm --filter @masjidtv/shared --filter @masjidtv/db build

      - name: Typecheck
        run: pnpm --filter @masjidtv/shared typecheck && pnpm --filter @masjidtv/db typecheck && pnpm --filter @masjidtv/server typecheck && pnpm --filter @masjidtv/cloud typecheck && pnpm --filter @masjidtv/frontend typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
