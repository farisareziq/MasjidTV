name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bina pakej asas dahulu — type/test server & cloud menyelesaikan
      # @masjidtv/{shared,db} melalui dist/ (lihat package exports).
      # Server dist juga diperlukan oleh @masjidtv/kiosk (typecheck).
      - name: Build workspace deps
        run: pnpm --filter @masjidtv/shared --filter @masjidtv/db --filter @masjidtv/server build

      - name: Typecheck
        run: pnpm --filter @masjidtv/shared typecheck && pnpm --filter @masjidtv/db typecheck && pnpm --filter @masjidtv/server typecheck && pnpm --filter @masjidtv/cloud typecheck && pnpm --filter @masjidtv/frontend typecheck && pnpm --filter @masjidtv/kiosk typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # E2E Linux-safe: pelayan lokal sahaja (tiada Electron diperlukan).
      - name: E2E dry-run (local server)
        run: node scripts/dry-run.mjs

      # E2E keselamatan (cloud lokal + server lokal) — Linux-safe.
      - name: Pentest (security regression)
        run: node scripts/pentest.mjs

  e2e-kiosk:
    name: E2E kiosk (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps
        run: pnpm --filter @masjidtv/shared --filter @masjidtv/db --filter @masjidtv/server build

      # Bekalkan ffmpeg sekali (cached) supaya kiosk e2e tidak memuat turun
      # ~80MB semasa runtime (menyekat server mula → health timeout di CI).
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: apps/kiosk/bin/ffmpeg.exe
          key: ffmpeg-win-x64-v1

      - name: Download ffmpeg (if not cached)
        run: node tools/download-ffmpeg.mjs
        working-directory: apps/kiosk

      # DIAGNOSTIK: uji Electron boleh lancar di runner (tangkap ralat GUI).
      - name: Probe Electron launch
        shell: pwsh
        run: |
          $exe = "apps/kiosk/node_modules/electron/dist/electron.exe"
          Write-Host "exe exists: $(Test-Path $exe)"
          & $exe --version 2>&1 | Out-String | Write-Host
          Write-Host "exit: $LASTEXITCODE"
          # Uji lancarkan app sebenar 15sa — tangkap stdout/stderr.
          $env:MASJIDTV_HEADLESS='1'; $env:MASJIDTV_DATA_DIR="$env:TEMP\kprobe"
          $env:ELECTRON_ENABLE_LOGGING='1'; $env:ELECTRON_ENABLE_STACK_DUMPING='1'
          $p = Start-Process $exe -ArgumentList '.','--in-process-gpu','--no-kiosk','--no-autostart','--port','59990' -WorkingDirectory 'apps/kiosk' -RedirectStandardOutput "$env:TEMP\kout.txt" -RedirectStandardError "$env:TEMP\kerr.txt" -PassThru
          Start-Sleep -Seconds 20
          Write-Host "hasexited: $($p.HasExited) exitcode: $($p.ExitCode)"
          Write-Host "--- STDOUT ---"; Get-Content "$env:TEMP\kout.txt" -ErrorAction SilentlyContinue
          Write-Host "--- STDERR ---"; Get-Content "$env:TEMP\kerr.txt" -ErrorAction SilentlyContinue
          try { (Invoke-WebRequest 'http://localhost:59990/api/health' -TimeoutSec 3 -UseBasicParsing).StatusCode | Write-Host } catch { Write-Host "no health: $($_.Exception.Message)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: E2E pairing (cloud + kiosk Electron)
        # Runner Windows headless — Electron GUI (app.whenReady) lambat mula;
        # benarkan timeout health lebih panjang (lalai 45sa terlalu ketat di CI).
        env:
          E2E_HEALTH_TIMEOUT_S: '180'
          FFMPEG_PATH: ${{ github.workspace }}/apps/kiosk/bin/ffmpeg.exe
        run: node scripts/e2e-pairing.mjs

      - name: Dry-run kiosk (simulasi hari operasi)
        env:
          E2E_HEALTH_TIMEOUT_S: '180'
          FFMPEG_PATH: ${{ github.workspace }}/apps/kiosk/bin/ffmpeg.exe
        run: node scripts/dry-run-kiosk.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
