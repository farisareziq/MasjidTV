name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Batalkan larian CI tumpang-tindih pada branch/ref yang sama — menjimatkan
# minit runner (push baru ke master membatalkan larian lama yang belum siap).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bina pakej asas dahulu — type/test server & cloud menyelesaikan
      # @masjidtv/{shared,db} melalui dist/ (lihat package exports).
      # Server dist juga diperlukan oleh @masjidtv/kiosk (typecheck).
      - name: Build workspace deps
        run: pnpm --filter @masjidtv/shared --filter @masjidtv/db --filter @masjidtv/server build

      - name: Typecheck
        run: pnpm --filter @masjidtv/shared typecheck && pnpm --filter @masjidtv/db typecheck && pnpm --filter @masjidtv/server typecheck && pnpm --filter @masjidtv/cloud typecheck && pnpm --filter @masjidtv/frontend typecheck && pnpm --filter @masjidtv/kiosk typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # E2E Linux-safe: pelayan lokal sahaja (tiada Electron diperlukan).
      - name: E2E dry-run (local server)
        run: node scripts/dry-run.mjs

      # E2E keselamatan (cloud lokal + server lokal) — Linux-safe.
      - name: Pentest (security regression)
        run: node scripts/pentest.mjs

  e2e-kiosk:
    name: E2E kiosk (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    # NON-BLOCKING: runner Windows GitHub ialah headless tanpa sesi desktop
    # interaktif — Electron GUI tersekat pada rintisan tahap terendah (proses
    # hidup, STDOUT/STDERR kosong, /api/health tidak menjawab) walaupun dengan
    # --disable-gpu / disableHardwareAcceleration / --in-process-gpu /
    # ELECTRON_ENABLE_LOGGING. Ini batasan persekitaran runner yang direkodkan,
    # BUKAN kelemahan kod — e2e-pairing + dry-run-kiosk LULUS sepenuhnya pada
    # peranti Windows sebenar (server naik ~2sa, pairing, SSE, dshow, unpair).
    # Ujian kiosk kekal wajib dijalankan MANUAL di mini PC sebelum rilis.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps
        run: pnpm --filter @masjidtv/shared --filter @masjidtv/db --filter @masjidtv/server build

      # Bekalkan ffmpeg sekali (cached) supaya kiosk e2e tidak memuat turun
      # ~80MB semasa runtime (menyekat server mula → health timeout di CI).
      # Kunci cache terikat kepada pin sha256 dalam download-ffmpeg.mjs —
      # kemas kini pin → cache miss automatik → binari baharu disahkan.
      # Sidecar .sha256 ditulis bersama binari; skrip mengesahkan semula
      # integriti cache pada setiap larian (cache rosak → muat semula).
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            apps/kiosk/bin/ffmpeg.exe
            apps/kiosk/bin/ffmpeg.exe.sha256
          key: ffmpeg-win-x64-sha256-3e44203be3d6aaea41d720a32ef6604873c559d45e03ff43cace2b49e23e5241
          # Fallback buat masa kini masih membenarkan larian tanpa muat turun,
          # tetapi integriti disahkan oleh sidecar — bukan percaya buta.
          restore-keys: |
            ffmpeg-win-x64-sha256-

      - name: Download ffmpeg (if not cached)
        run: node tools/download-ffmpeg.mjs
        working-directory: apps/kiosk
        env:
          FFMPEG_SHA256: '3e44203be3d6aaea41d720a32ef6604873c559d45e03ff43cace2b49e23e5241'

      - name: E2E pairing (cloud + kiosk Electron)
        # Runner Windows headless — Electron GUI (app.whenReady) lambat mula;
        # benarkan timeout health lebih panjang (lalai 45sa terlalu ketat di CI).
        env:
          E2E_HEALTH_TIMEOUT_S: '180'
          FFMPEG_PATH: ${{ github.workspace }}/apps/kiosk/bin/ffmpeg.exe
        run: node scripts/e2e-pairing.mjs

      - name: Dry-run kiosk (simulasi hari operasi)
        env:
          E2E_HEALTH_TIMEOUT_S: '180'
          FFMPEG_PATH: ${{ github.workspace }}/apps/kiosk/bin/ffmpeg.exe
        run: node scripts/dry-run-kiosk.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
