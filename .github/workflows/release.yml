name: Release

# Bina installer kiosk (Windows) setiap tag v* — muat naik sebagai GitHub
# Release artifact. Menggantikan binaan manual `node apps/kiosk/tools/package.mjs`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Elakkan rilis tumpang-tindih (tag push berganda, atau cron + manual serentak).
# cancel-in-progress: false — rilis harus siap, bukan dibatalkan separuh jalan.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kiosk:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      # ffmpeg dibundel bersama installer (resources/bin) — cache unduhan
      # supaya larian berturut tidak muat turun semula (~80MB).
      # Kunci cache terikat kepada pin sha256 dalam download-ffmpeg.mjs —
      # kemas kini pin → cache miss automatik → binari baharu disahkan.
      # Sidecar .sha256 ditulis bersama binari; skrip mengesahkan semula
      # integriti cache pada setiap larian (cache rosak → muat semula).
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            apps/kiosk/bin/ffmpeg.exe
            apps/kiosk/bin/ffmpeg.exe.sha256
          key: ffmpeg-win-x64-sha256-fe5a8f090b9fbc77d5e64c7d8b404b8837e05a09663ed9768ba19284cf929b20
          restore-keys: |
            ffmpeg-win-x64-sha256-

      # download-ffmpeg.mjs mengesahkan sha256 zip (API digest / FFMPEG_SHA256)
      # sebelum pakej — tanpa pengesahan, rilis GAGAL.
      - name: Download ffmpeg (if not cached)
        run: node tools/download-ffmpeg.mjs
        working-directory: apps/kiosk
        env:
          FFMPEG_SHA256: 'fe5a8f090b9fbc77d5e64c7d8b404b8837e05a09663ed9768ba19284cf929b20'

      - name: Package kiosk (electron-builder NSIS + portable)
        run: node tools/package.mjs
        working-directory: apps/kiosk

      # Stamp terkini dalam dist-kiosk — muat naik SEMUA installer/portable.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows
          path: |
            apps/kiosk/dist-kiosk/*/*.exe
          retention-days: 14

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF}" -replace '^refs/tags/', ''
          $files = Get-ChildItem -Path apps/kiosk/dist-kiosk -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match 'win-unpacked' -eq $false }
          Write-Host "Artifacts: $($files.FullName -join ', ')"
          foreach ($f in $files) {
            # sha256 bersebelahan setiap artifact (sama format seperti rilis lama)
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)" | Set-Content -Path "$($f.FullName).sha256" -NoNewline
            & gh release upload $tag "$($f.FullName)" "$($f.FullName).sha256" --clobber
            if ($LASTEXITCODE -ne 0) {
              # Rilis belum wujud — cipta dahulu.
              & gh release create $tag "$($f.FullName)" "$($f.FullName).sha256" --title "MasjidTV $tag" --generate-notes
              if ($LASTEXITCODE -ne 0) { throw "gh release gagal" }
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # APK Android TV (Flutter) — sideload jalan luar, bukan Google Play.
  # APK ditandatangani dengan debug keystore Flutter lalai (bukan keystore
  # rasmi Google Play) — sesuai untuk edaran terhad/pelanggan masjid yang
  # pasang manual melalui "Install unknown app". Tidak boleh dimuat naik ke
  # Play Store. Guna JDK 17 (AGP 8.7.3 perlu JDK 17+).
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pin Flutter 3.32.8 — MESTI memenuhi kekangan SDK dalam pubspec.lock
      # (dart >=3.8.0 / flutter >=3.32.0, kesatuan had bawah webview_flutter
      # 4.13.1 dsb.). 3.32.8 ialah versi SDK tempatan yang menghasilkan
      # lockfile ini. Kemas kini versi memerlukan ujian peranti sebenar
      # (MiTV Android 14 armeabi-v7a).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter dependencies
        run: flutter pub get
        working-directory: apps/android-tv

      # --release — bina APK produksi. signingConfig debug (lihat
      # app/build.gradle.kts) menandatangani APK dengan debug key Flutter.
      # APK universal (semua ABI) — saiz lebih besar tetapi satu fail
      # untuk semua peranti (arm64-v8a, armeabi-v7a, x86_64).
      - name: Build APK (release, universal)
        run: flutter build apk --release
        working-directory: apps/android-tv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk
          path: apps/android-tv/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          src="apps/android-tv/build/app/outputs/flutter-apk/app-release.apk"
          # Namakan semula dengan tag supaya fail unik per-rilis dan
          # sha256sum -c mengesahkan fail tepat yang dimuat turun tanpa
          # bergantung pada lokasi/nama tempatan pengguna.
          dst="masjidtv-${tag}-universal.apk"
          cp "$src" "$dst"
          sha="$(sha256sum "$dst" | awk '{print $1}')"
          echo "${sha}  ${dst}" > "${dst}.sha256"
          echo "APK: $dst (sha256: $sha)"
          gh release upload "$tag" "$dst" "${dst}.sha256" --clobber || \
            gh release create "$tag" "$dst" "${dst}.sha256" --title "MasjidTV $tag" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
