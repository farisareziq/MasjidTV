name: Release

# Bina installer kiosk (Windows) setiap tag v* — muat naik sebagai GitHub
# Release artifact. Menggantikan binaan manual `node apps/kiosk/tools/package.mjs`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Elakkan rilis tumpang-tindih (tag push berganda, atau cron + manual serentak).
# cancel-in-progress: false — rilis harus siap, bukan dibatalkan separuh jalan.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kiosk:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      # ffmpeg dibundel bersama installer (resources/bin) — cache unduhan
      # supaya larian berturut tidak muat turun semula (~80MB).
      # Kunci cache terikat kepada pin sha256 dalam download-ffmpeg.mjs —
      # kemas kini pin → cache miss automatik → binari baharu disahkan.
      # Sidecar .sha256 ditulis bersama binari; skrip mengesahkan semula
      # integriti cache pada setiap larian (cache rosak → muat semula).
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            apps/kiosk/bin/ffmpeg.exe
            apps/kiosk/bin/ffmpeg.exe.sha256
          key: ffmpeg-win-x64-sha256-fe5a8f090b9fbc77d5e64c7d8b404b8837e05a09663ed9768ba19284cf929b20
          restore-keys: |
            ffmpeg-win-x64-sha256-

      # download-ffmpeg.mjs mengesahkan sha256 zip (API digest / FFMPEG_SHA256)
      # sebelum pakej — tanpa pengesahan, rilis GAGAL.
      - name: Download ffmpeg (if not cached)
        run: node tools/download-ffmpeg.mjs
        working-directory: apps/kiosk
        env:
          FFMPEG_SHA256: 'fe5a8f090b9fbc77d5e64c7d8b404b8837e05a09663ed9768ba19284cf929b20'

      - name: Package kiosk (electron-builder NSIS + portable)
        run: node tools/package.mjs
        working-directory: apps/kiosk

      # Stamp terkini dalam dist-kiosk — muat naik SEMUA installer/portable.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows
          path: |
            apps/kiosk/dist-kiosk/*/*.exe
          retention-days: 14

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF}" -replace '^refs/tags/', ''
          $files = Get-ChildItem -Path apps/kiosk/dist-kiosk -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match 'win-unpacked' -eq $false }
          Write-Host "Artifacts: $($files.FullName -join ', ')"
          foreach ($f in $files) {
            # sha256 bersebelahan setiap artifact (sama format seperti rilis lama)
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)" | Set-Content -Path "$($f.FullName).sha256" -NoNewline
            & gh release upload $tag "$($f.FullName)" "$($f.FullName).sha256" --clobber
            if ($LASTEXITCODE -ne 0) {
              # Rilis belum wujud — cipta dahulu.
              & gh release create $tag "$($f.FullName)" "$($f.FullName).sha256" --title "MasjidTV $tag" --generate-notes
              if ($LASTEXITCODE -ne 0) { throw "gh release gagal" }
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
